<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Middleman — names the middleman: an orange hairpin, one wallet's sell turning back into its own buy, between the blue print before it and the blue print after it">
  <title>Middleman</title>

  <!-- Mechanism: "names the middleman".
       Three shapes only, so the mark survives a 16px favicon:
         1. the blue print above  = the print before the legs — the quote you saw
         2. the orange hairpin    = the same wallet's sell (→) turning back into its own buy (←):
                                    one stroke because it is one wallet — the middleman
         3. the blue print below  = the print after the legs — the fill you got
       Carries its own plate so it holds on GitHub light (#ffffff) AND dark (#0d1117):
       orange 7.3:1 and blue 10:1 on #0d1117, the plate edge 19:1 on white.
       Each colour is var(token, hex): the hex applies when rasterised standalone; the token wins
       when _tokens.css is loaded around it. Generated by generate-animated.cjs: one geometry. -->

  <rect width="512" height="512" rx="112" fill="var(--bg-base, #0C0F14)"/>
  <rect x="8" y="8" width="496" height="496" rx="105" fill="none" stroke="var(--plate-edge, #3A4759)" stroke-width="6"/>

  <!-- 1. the print before: a stranger's fill -->
  <line x1="120" y1="128" x2="392" y2="128" stroke="var(--organic, #5AC8FA)" stroke-width="40" stroke-linecap="round"/>

  <!-- 2. the round-trip: sell out to the right, turn, buy back to the left — one wallet, one stroke -->
  <path d="M120 214 H350 A42 42 0 0 1 350 298 H160" fill="none" stroke="var(--middle, #FF7A45)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M144 274 L120 298 L144 322" fill="none" stroke="var(--middle, #FF7A45)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. the print after: a stranger's fill -->
  <line x1="120" y1="384" x2="392" y2="384" stroke="var(--organic, #5AC8FA)" stroke-width="40" stroke-linecap="round"/>
</svg>
