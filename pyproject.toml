[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the page renderer embeds HTML rows as f-strings; wrapping markup to 100 columns hurts more
# than it helps, and the output is checked by rendering it, not by reading it
"scripts/render_site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["live: hits the real CoinMarketCap API"]
